short_bio: >-
  <p>
    I am a Ph.D. student at the <a href="https://www.hku.hk/" target="_blank">University of Hong Kong</a>,
    advised by <a href="https://leuchine.github.io/" target="_blank">Prof. Qi Liu</a>.
    I currently work on <a href="https://scholar.google.com/citations?hl=en&user=7gxp6NkAAAAJ&view_op=list_works&sortby=pubdate" target="_blank">AI for Finance and Quantitative Finance</a>.
  </p>
  <p>
    I received my master's degree from the <a href="https://www.ox.ac.uk/" target="_blank">University of Oxford</a>,
    where I was advised by <a href="https://jindonggu.github.io/" target="_blank">Dr. Jindong Gu</a>
    and <a href="https://eng.ox.ac.uk/people/philip-torr" target="_blank">Prof. Philip Torr</a>.
    Before that, I received my bachelor's degrees from the <a href="https://www.washington.edu/" target="_blank">University of Washington</a>.
  </p>

