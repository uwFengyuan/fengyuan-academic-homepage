short_bio_text_justify: false
short_bio: >-
  <p>
    I am a researcher at the <a href="https://www.hku.hk/" target="_blank">University of Hong Kong</a>,
    working on <a href="https://scholar.google.com/citations?hl=en&user=7gxp6NkAAAAJ&view_op=list_works&sortby=pubdate" target="_blank">AI for Finance, Quantitative Finance, Reliable AI, and AI Safety</a>.
    My recent work studies how language models can reason, code, evaluate, and evolve in high-stakes scientific and financial settings.
  </p>
  <p>
    I build agentic systems for <a href="https://arxiv.org/abs/2607.08332" target="_blank">alpha discovery</a>,
    <a href="https://aclanthology.org/2026.findings-acl.138.pdf" target="_blank">financial code generation</a>,
    <a href="https://arxiv.org/abs/2403.09766" target="_blank">model reliability</a>, and
    <a href="https://aclanthology.org/2025.emnlp-main.611/" target="_blank">multi-agent decision making</a>.
    See my <a href="https://github.com/uwFengyuan/fengyuan-academic-homepage" target="_blank">GitHub</a>
    and <a href="https://scholar.google.com/citations?hl=en&user=7gxp6NkAAAAJ&view_op=list_works&sortby=pubdate" target="_blank">Google Scholar</a>
    for source code, papers, and citation updates.
  </p>

