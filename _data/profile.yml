short_bio: >-
  <p>
    I am a researcher at the University of Hong Kong working on AI for Finance, Quantitative Finance, Reliable AI, and AI Safety.
    My recent work studies how language models can reason, code, evaluate, and evolve in high-stakes scientific and financial settings.
  </p>
  <p>
    I build agentic systems for alpha discovery, financial code generation, model reliability, and multi-agent decision making.
    This page is initialized from my public Google Scholar profile and should be refined with project pages, code links, and selected paper figures over time.
  </p>

