short_bio_text_justify: false
short_bio: >-
  <p>
    I am a Ph.D. student at the <a href="https://www.hku.hk/" target="_blank">University of Hong Kong</a>,
    advised by <a href="https://leuchine.github.io/" target="_blank">Prof. Qi Liu</a>. I received my master's
    degree from the <a href="https://www.ox.ac.uk/" target="_blank">University of Oxford</a>, where I was advised by
    <a href="https://jindonggu.github.io/" target="_blank">Dr. Jindong Gu</a> and
    <a href="https://eng.ox.ac.uk/people/philip-torr" target="_blank">Prof. Philip Torr</a>. Before that, I received
    a double major from the <a href="https://www.washington.edu/" target="_blank">University of Washington</a>:
    Computer Science and Applied Computational Mathematical Sciences (Data Science &amp; Statistics).
  </p>
  <p>
    My previous research spans vision-language robustness, multi-agent systems, and tabular learning. At Oxford, I
    worked on image origin attribution and adversarial robustness for vision-language models. At
    <a href="https://roboticsx.tencent.com/" target="_blank">Tencent Robotics X</a>, advised by
    <a href="https://ruizhaogit.github.io/" target="_blank">Dr. Rui Zhao</a>, I studied adversarial manipulation in
    multi-agent systems, factuality and reasoning in vision-language models, and self-play for LLM-based agents. At
    <a href="https://iiis.tsinghua.edu.cn/en/" target="_blank">Tsinghua IIIS</a>, advised by
    <a href="https://people.iiis.tsinghua.edu.cn/~jianli/" target="_blank">Prof. Jian Li</a>, I worked on automated
    feature generation for tabular machine learning and smart beta modeling with multi-factor financial data.
  </p>
  <p>
    My current research focuses on
    <a href="https://scholar.google.com/citations?hl=en&user=7gxp6NkAAAAJ&view_op=list_works&sortby=pubdate" target="_blank">AI for Finance</a>
    and Quantitative NLP. I welcome collaborations in these directions.
  </p>

